# The passing candidate (R10b): top_k 6 over its own copy of the baseline index
# (150/30, nomic-embed-text). Gate: eval/results/c2/gate-k6.txt (pass).
#   kubectl apply -k k8s/release/k6
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../candidate
configMapGenerator:
  - name: candidate-config
    behavior: merge
    literals:
      - CHROMA_COLLECTION=rahbar-k6
      - TOP_K=6
patches:
  - target: {kind: Job, name: index-candidate}
    patch: |-
      - {op: replace, path: /metadata/name, value: index-rahbar-k6}
