# The candidate (RAGOps F3, C3): a second Deployment and Service, the api's image and
# probes, its own collection. Values that differ from the live api come from the
# candidate-config ConfigMap, listed after rahbar-config so its keys win.
# The eval Job is run against http://api-candidate:8000 (label app: ragops-eval); nothing
# else can reach it (NetworkPolicy api-candidate in k8s/base/networkpolicy.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
  labels: {app: api-candidate}
spec:
  replicas: 1                          # it serves the eval Job, not users
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: api-candidate}
  template:
    metadata:
      labels: {app: api-candidate}
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: rahbar-api
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: rahbar-config}
            - configMapRef: {name: candidate-config}   # last wins: the candidate's values
          # The embedding pin applies here too: a candidate whose EMBED_MODEL does not match
          # its collection stays not-ready (§4.4), so a half-built candidate is never tested.
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: results, mountPath: /results}   # its traces sit beside the live api's
          resources:                  # the api's measured numbers (docs/evidence/kubectl-top.txt, eval/results/f5)
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: "500m"
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: results
          persistentVolumeClaim: {claimName: ragops-results}
---
apiVersion: v1
kind: Service
metadata:
  name: api-candidate
  labels: {app: api-candidate}
spec:
  type: ClusterIP
  selector: {app: api-candidate}
  ports:
    - {name: http, port: 8000, targetPort: http}
