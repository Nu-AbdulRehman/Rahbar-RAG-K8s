# One ServiceAccount per workload (§4.7). None of them calls the API server, so no Role is
# bound and every pod also sets automountServiceAccountToken: false.
apiVersion: v1
kind: ServiceAccount
metadata: {name: api}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ui}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: chroma}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: redis}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: indexer}
automountServiceAccountToken: false
