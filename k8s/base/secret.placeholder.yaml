# The shape of the real Secret, nothing more. NEVER list this file in kustomization.yaml:
# applying it would overwrite the real key. Create the real one from the command line (§4.7):
#   export LLM_API_KEY=...; make secret
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
