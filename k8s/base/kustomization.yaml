apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
# secret.placeholder.yaml is deliberately NOT listed: applying it would overwrite the real
# Secret created by `make secret` (§4.7).
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - chroma.yaml
  - redis.yaml
  - api.yaml
  - ui.yaml
  - indexer.yaml
  - ingress.yaml
