# The only writer to Chroma (§4.2, ADR 0001). The Job indexes once; the CronJob re-indexes
# weekly with the same image, command and arguments. Re-index without a redeploy:
#   kubectl create job --from=cronjob/reindex manual-reindex-1 -n rahbar
# The command downloads the corpus into the data lake's raw/ on the ragops-data PVC (RAGOps
# F1, R4), refuses to go on if any file's SHA-256 differs from the committed
# corpus/MANIFEST.md, then runs the pipeline: intake of incoming/ (a new batch), verify
# (quality, completeness, recency, uniqueness; failures moved to quarantine/), archive
# superseded versions, incremental sync to Chroma, cache invalidation (RAGOps A1, A2).
# fetch.py only downloads what raw/ is missing, so an unchanged corpus costs no download
# and embeds 0 chunks. Thresholds come from the ragops-gate ConfigMap (R6).
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  labels: {app: indexer}
spec:
  backoffLimit: 6                      # back-off 10+20+40+80+160 s: covers chroma and redis still starting on a fresh cluster (failure-log)
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels: {app: indexer}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: indexer
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001                 # the data lake PVC is writable by the non-root user
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: indexer
          image: rahbar-indexer
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - >-
              python corpus/fetch.py --out "$CORPUS_DIR" &&
              python corpus/fetch.py --verify --out "$CORPUS_DIR" &&
              python -m pipeline.run
          envFrom:
            - configMapRef: {name: rahbar-config}
            - configMapRef: {name: ragops-gate}     # VERIFY_* thresholds (R6)
          volumeMounts:
            - {name: data-lake, mountPath: /data}     # DATA_LAKE_DIR; CORPUS_DIR is its raw/
            - {name: tmp, mountPath: /tmp}
          resources:                  # peak 1659m, 1159Mi during OCR; the limit is 1.5x peak, so a bigger scan is not an exit 137 (docs/evidence/kubectl-top.txt)
            requests:
              cpu: 500m
              memory: 1280Mi
            limits:
              cpu: "2"
              memory: 1792Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data-lake
          persistentVolumeClaim: {claimName: ragops-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  labels: {app: indexer}
spec:
  schedule: "0 3 * * 0"                # weekly, Sunday 03:00
  concurrencyPolicy: Forbid            # never two writers at once
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 6
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: {app: indexer}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: indexer
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: indexer
              image: rahbar-indexer
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - >-
                  python corpus/fetch.py --out "$CORPUS_DIR" &&
                  python corpus/fetch.py --verify --out "$CORPUS_DIR" &&
                  python -m pipeline.run
              envFrom:
                - configMapRef: {name: rahbar-config}
                - configMapRef: {name: ragops-gate}
              volumeMounts:
                - {name: data-lake, mountPath: /data}     # DATA_LAKE_DIR; CORPUS_DIR is its raw/
                - {name: tmp, mountPath: /tmp}
              resources:                  # peak 1659m, 1159Mi during OCR; the limit is 1.5x peak, so a bigger scan is not an exit 137 (docs/evidence/kubectl-top.txt)
                requests:
                  cpu: 500m
                  memory: 1280Mi
                limits:
                  cpu: "2"
                  memory: 1792Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: data-lake
              persistentVolumeClaim: {claimName: ragops-data}
            - name: tmp
              emptyDir: {}
