# The release gate alone, as a Job (RAGOps C2, F2): applies scripts/gate.py to two suite
# result files already on the ragops-results volume, with the thresholds from the
# ragops-gate ConfigMap mounted at /config. It takes seconds, so the F2 demonstration
# (edit a threshold, re-run, the decision changes, no rebuild) does not re-run the suite:
#
#   kubectl apply -f k8s/gate-job.yaml                       # -> Failed (minilm rejected)
#   kubectl logs -n rahbar job/ragops-gate
#   kubectl edit configmap ragops-gate -n rahbar             # recall_at_5 max_drop 0.02 -> 0.10
#   kubectl delete job ragops-gate -n rahbar; kubectl apply -f k8s/gate-job.yaml   # -> Complete
#
# The eval Job (k8s/eval-job.yaml) runs the same gate right after the suite. Files are
# picked by label: the newest /results/eval/*-<label>.json. Change BASELINE / CANDIDATE
# below to gate another pair. Not part of kustomization.yaml: it is run on demand.
apiVersion: batch/v1
kind: Job
metadata:
  name: ragops-gate
  namespace: rahbar
  labels: {app: ragops-gate}
spec:
  backoffLimit: 0                      # a failed gate is an answer, not a crash: never retry it
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels: {app: ragops-gate}       # no NetworkPolicy allow rule: it needs no network
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gate
          image: rahbar-eval:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - >-
              base=$(ls -t /results/eval/*-"$BASELINE".json | head -n 1) &&
              cand=$(ls -t /results/eval/*-"$CANDIDATE".json | head -n 1) &&
              mkdir -p /results/gate &&
              python scripts/gate.py "$base" "$cand"
              --out "/results/gate/$(date -u +%Y%m%dT%H%M%SZ)-$CANDIDATE-vs-$BASELINE.json"
          env:
            - {name: BASELINE, value: baseline-44}
            - {name: CANDIDATE, value: minilm-44}
          envFrom:
            - configMapRef: {name: ragops-gate}      # GATE_CONFIG=/config/gate.yaml
          volumeMounts:
            - {name: gate-config, mountPath: /config, readOnly: true}
            - {name: results, mountPath: /results}
            - {name: tmp, mountPath: /tmp}
          resources:                  # measured: eval/results/f5/resources.md
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: gate-config
          configMap:
            name: ragops-gate
            items:
              - {key: gate.yaml, path: gate.yaml}
        - name: results
          persistentVolumeClaim: {claimName: ragops-results}
        - name: tmp
          emptyDir: {}
